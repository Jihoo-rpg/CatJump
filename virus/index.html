<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>바이러스 시뮬레이터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ============ 상단: 세계 통계 ============ -->
<header id="top">
  <div class="brand"><span class="logo">🦠</span><div><b>VIRUS SIMULATOR</b><small id="vName">-</small></div></div>
  <div class="stats">
    <div class="st"><small>세계 인구</small><b id="sPop">-</b></div>
    <div class="st inf"><small>현재 감염자</small><b id="sInf">-</b></div>
    <div class="st cum"><small>누적 감염자</small><b id="sCum">-</b></div>
    <div class="st rec"><small>회복자(면역 포함)</small><b id="sRec">-</b></div>
    <div class="st"><small>감염되지 않은 인구</small><b id="sSus">-</b></div>
    <div class="st res"><small>백신 연구</small><b id="sRes">0%</b><i class="bar"><i id="sResBar"></i></i></div>
    <div class="st goal"><small id="sGoalL">확산 점수</small><b id="sGoal">-</b></div>
  </div>
  <div class="topbtn">
    <button id="btnFull" title="전체 화면">⛶</button>
    <button id="btnMenu" title="메뉴">☰</button>
  </div>
</header>

<main id="main">
  <!-- ============ 왼쪽: 바이러스 정보 ============ -->
  <aside id="left">
    <section class="card" id="virusCard">
      <div class="vhead"><span id="vIcon">🦠</span><div><b id="vTitle">-</b><small id="vType">-</small></div></div>
      <div class="traits" id="traits"></div>
      <div class="pts"><span id="ptsLabel">진화 포인트</span><b id="pts">0</b></div>
    </section>
    <section class="card grow" id="upCard">
      <div class="tabs" id="upTabs"></div>
      <div id="upList" class="uplist"></div>
    </section>
    <section class="card" id="chartCard">
      <div class="ctitle">감염자 · 회복자 추이 <span class="lg"><i class="dI"></i>감염 <i class="dR"></i>회복 <i class="dC"></i>누적</span></div>
      <canvas id="chart" width="560" height="200"></canvas>
    </section>
  </aside>

  <!-- ============ 가운데: 세계 지도 ============ -->
  <section id="mapWrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="mapCtl">
      <button id="zIn" title="확대">＋</button>
      <button id="zOut" title="축소">－</button>
      <button id="zReset" title="처음 크기">⟲</button>
      <button id="tRoutes" title="이동 경로 표시">✈</button>
    </div>
    <div id="legend">
      <span><i style="background:var(--c0)"></i>감염 없음</span>
      <span><i style="background:var(--c1)"></i>낮음</span>
      <span><i style="background:var(--c2)"></i>중간</span>
      <span><i style="background:var(--c3)"></i>높음</span>
      <span><i style="background:var(--c4)"></i>회복 완료</span>
    </div>
    <div id="hint"></div>
    <div id="mapErr" class="hidden"></div>
  </section>

  <!-- ============ 오른쪽: 국가 정보 ============ -->
  <aside id="right">
    <section class="card grow" id="countryCard"></section>
  </aside>
</main>

<!-- ============ 아래: 뉴스 + 시간 조절 ============ -->
<footer id="bottom">
  <div id="date"><small>DAY <b id="dDay">0</b></small><b id="dDate">-</b></div>
  <div id="speed">
    <button data-sp="0" title="일시정지 (스페이스)">❚❚</button>
    <button data-sp="1" title="1배속">▶ 1×</button>
    <button data-sp="3" title="3배속">▶▶ 3×</button>
    <button data-sp="10" title="10배속">⏩ 10×</button>
  </div>
  <div id="news"><div id="newsTicker"></div><button id="newsMore" title="뉴스 전체 보기">📰</button></div>
</footer>

<!-- ============ 팝업들 ============ -->
<div id="overlay" class="hidden"><div id="modal"></div></div>
<div id="toast"></div>

<script src="data/world.js"></script>
<script src="script.js"></script>
</body>
</html>
