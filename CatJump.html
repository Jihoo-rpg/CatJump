  else if(a.currentTime>=MUS.swapAt){MUS.zone=MUS.want;MUS.step=0;MUS.next=a.currentTime+.05;MUS.swapAt=0;MUS.bus.gain.cancelScheduledValues(a.currentTime);MUS.bus.gain.setValueAtTime(0,a.currentTime);MUS.bus.gain.linearRampToValueAtTime(on?.55:0,a.currentTime+2);}}

/* ---------- 레벨 생성 ---------- */
function pickW(opts){let t=0;for(const o of opts)t+=Math.max(0,o[1]);let x=gr()*t;for(const o of opts){x-=Math.max(0,o[1]);if(x<=0)return o[0];}return opts[0][0];}
function coinCol(side,y,n){const x=side==='L'?LX+CLING:RX-CLING;for(let k=0;k<n;k++)coins.push({x,y:y-k*15,ph:gr()*6});}
function coinArc(y,dir){let x=dir>0?LX+CLING:RX-CLING,yy=y,vy=-360;const vx=dir*225;for(let k=0;k<7;k++){const t=.075;x+=vx*t;vy+=GRAV*t;yy+=vy*t;if(x>LX+14&&x<RX-14)coins.push({x,y:yy,ph:k*.5});}}
function coinPattern(y){if(gr()<.45)coinCol(gr()<.5?'L':'R',y,3+(gr()*3|0));else coinArc(y,gr()<.5?1:-1);}
function candyPattern(y){const n=2+(gr()*3|0),x0=grnd(40,140-n*12);for(let k=0;k<n;k++)items.push({type:'candy',x:x0+k*13,y:y-Math.sin(k)*4,ph:k});}
/* 공정한 맵 규칙: 양쪽 벽이 동시에 위험하지 않게, 가운데 장애물끼리 너무 붙지 않게 */
let wallD=[],midD=[];
function wallFree(side,y1,y2){return!wallD.some(d=>d.side!==side&&d.y1<y2+70&&d.y2>y1-70)&&!midD.some(m=>m.y>y1-35&&m.y<y2+35);}
function midFree(y){return!midD.some(m=>Math.abs(m.y-y)<80)&&!wallD.some(d=>y>d.y1-35&&y<d.y2+35);}
const isHardZone=fl=>false;
function genChunk(y0){
 const yT=y0-CH,ym=y0-CH/2,fl=-ym/FPX,hw=isHW(fl),hard=isHardZone(fl);
 let d=clamp(fl/1000,0,1)*.75+clamp((fl-1000)/4000,0,.25)+clamp((fl-5000)/5000,0,1)*.3;if(mode==='hard')d=Math.min(1.4,d+.6);if(hard)d=Math.min(1.3,d+.4);
 const calmHere=calm.some(([a,b])=>yT<b&&y0>a);
 if(y0>-560||calmHere){coinPattern(y0-20);if(hw)candyPattern(y0-70);return;}
 if(mode==='boss'){coinPattern(y0-20);if(fl>8&&gr()<.1){const sd=gr()<.5?'L':'R';if(gr()<.5){if(wallFree(sd,ym-24,ym+24)){hz.push({type:'spikes',side:sd,y1:ym-24,y2:ym+24});wallD.push({side:sd,y1:ym-24,y2:ym+24});}}else hz.push({type:'snow',side:sd,y1:ym-40,y2:ym+40});}return;}
 const opts=[['saw',2.5],['spikes',3],['coins',hard?.15:Math.max(.9,3.2-d*2.2)]];
 if(fl>35)opts.push(['snow',hard?.6:1.6]);
 if(fl>300)opts.push(['laser',.7+.8*d]);
 if(fl>50||hard)opts.push(['bird',.9+d]);
 if(hw)opts.push(['ghost',1.3+d]);
 if(fl>80)opts.push(['wallsaw',.7+1.1*d]);
 if(!hard&&fl>25&&lastCannon-ym>1600)opts.push(['cannon',1.1]);
 if(fl>250||hard)opts.push(['combo',hard?2.5:1.3*d]);
 if(fl>=900)opts.push(['mine',1.1+.5*d]);
 if(fl>=1200)opts.push(['spinbar',.85]);
 if(fl>=2000)opts.push(['arm',1.3]);
 let type=pickW(opts);const side=gr()<.5?'L':'R',other=side==='L'?'R':'L';
 const saw=(bx,by,ax,amp,sp)=>({type:'saw',bx,by,x:bx,y:by,r:9,ax,amp:amp||0,sp:sp||0,ph:grnd(0,6),rot:0});
 const midOK=y=>midFree(y);
 switch(type){
  case'saw':{if(!midOK(ym)){type='coins';break;}let s=saw(grnd(52,128),ym,null);if(fl>60&&gr()<.45){s.ax='x';s.amp=grnd(18,30);s.sp=grnd(1.1,1.9);s.bx=s.x=clamp(s.bx,LX+22+s.amp,RX-22-s.amp);}hz.push(s);midD.push({y:ym});break;}
  case'spikes':{let sd=gr()<.65?(lastSpikeSide==='L'?'R':'L'):lastSpikeSide;const len=34+Math.min(1,d)*26+grnd(0,12),y1=ym-len/2,y2=ym+len/2;
   if(!wallFree(sd,y1,y2)){sd=sd==='L'?'R':'L';if(!wallFree(sd,y1,y2)){type='coins';break;}}
   lastSpikeSide=sd;hz.push({type:'spikes',side:sd,y1,y2});wallD.push({side:sd,y1,y2});coinCol(sd==='L'?'R':'L',ym+20,3);break;}
  case'snow':{const len=grnd(60,105);hz.push({type:'snow',side,y1:ym-len/2,y2:ym+len/2});coinCol(side,ym+10,2);break;}
  case'laser':{if(!midOK(ym)){type='coins';break;}const per=2.9-Math.min(1,d)*.5;let span='F';if(gr()<.55){const sd=gr()<.5?'L':'R';if(wallFree(sd,ym-10,ym+10)){span=sd;wallD.push({side:sd,y1:ym-10,y2:ym+10});}}
   hz.push({type:'laser',y:ym,per,ph:grnd(0,per),span});midD.push({y:ym});break;}
  case'bird':{if(!midOK(ym)){type='coins';break;}hz.push({type:hw?'bat':'bird',x:grnd(40,140),y:ym,by:ym,dir:gr()<.5?-1:1,sp:30+Math.min(1,d)*30,fa:gr()});midD.push({y:ym});break;}
  case'ghost':{if(!midOK(ym)){type='coins';break;}hz.push({type:'ghost',bx:grnd(60,120),x:MX,by:ym,y:ym,amp:grnd(25,40),sp:grnd(.9,1.4),ph:grnd(0,6)});midD.push({y:ym});break;}
  case'wallsaw':{const amp=26+Math.min(1,d)*14,y1=ym-amp-12,y2=ym+amp+12;let sd=side;if(!wallFree(sd,y1,y2)){sd=other;if(!wallFree(sd,y1,y2)){type='coins';break;}}
   hz.push(saw(sd==='L'?LX:RX,ym,'y',amp,1.3+Math.min(1,d)*.8));wallD.push({side:sd,y1,y2});coinCol(sd==='L'?'R':'L',ym,3);break;}
  case'cannon':hz.push({type:'cannon',x:grnd(62,118),y:ym,shake:0});lastCannon=ym;coinArc(ym+40,gr()<.5?1:-1);break;
  case'combo':{let sd=side;if(!wallFree(sd,ym+5,ym+50))sd=other;if(!wallFree(sd,ym+5,ym+50)||!midOK(ym-40)){type='coins';break;}
   hz.push({type:'spikes',side:sd,y1:ym+5,y2:ym+50});wallD.push({side:sd,y1:ym+5,y2:ym+50});
   const s=saw(sd==='L'?grnd(95,120):grnd(60,85),ym-40,'x',16,1.3);hz.push(s);midD.push({y:ym-40});break;}
  case'arm':{let sd=gr()<.5?'L':'R';const y1=ym-16,y2=ym+16;if(!wallFree(sd,y1,y2)){sd=sd==='L'?'R':'L';if(!wallFree(sd,y1,y2)){type='coins';break;}}hz.push({type:'arm',side:sd,y:ym,ph:grnd(0,6),reach:0});wallD.push({side:sd,y1,y2});coinCol(sd==='L'?'R':'L',ym,3);break;}
  case'fireball':{if(!midOK(ym)){type='coins';break;}hz.push({type:'fireball',x:grnd(40,140),y0:ym,y:ym,sp:grnd(60,110),ph:grnd(0,6)});midD.push({y:ym});break;}
  case'mine':{let sd=side;if(!wallFree(sd,ym-12,ym+12)){sd=other;if(!wallFree(sd,ym-12,ym+12)){type='coins';break;}}hz.push({type:'mine',side:sd,y:ym});wallD.push({side:sd,y1:ym-12,y2:ym+12});coinCol(sd==='L'?'R':'L',ym,3);break;}
  case'spinbar':{if(!midOK(ym)){type='coins';break;}hz.push({type:'spinbar',x:MX,y:ym,rot:grnd(0,6),sp:grnd(1.6,2.8)*(gr()<.5?1:-1),len:28});midD.push({y:ym});break;}
 }
 if(fl>=8000&&type!=='cannon'&&gr()<clamp((fl-8000)/2000,0,1)*.55){const ey=ym+(gr()<.5?-42:42),es=gr()<.5?'L':'R';
  if(gr()<.5&&wallFree(es,ey-12,ey+12)){hz.push({type:'mine',side:es,y:ey});wallD.push({side:es,y1:ey-12,y2:ey+12});}
  else if(midFree(ey)){const pk=gr();if(pk<.4)hz.push({type:'spinbar',x:MX,y:ey,rot:grnd(0,6),sp:grnd(1.6,2.6)*(gr()<.5?1:-1),len:28});else hz.push(saw(grnd(52,128),ey,null));midD.push({y:ey});}}
 if(type==='coins'){coinPattern(ym+30);coinPattern(ym-30);}
 else if(type!=='cannon'&&gr()<.55)coinPattern(y0-12);
 if(hw&&(mode==='halloween'||gr()<.7))candyPattern(y0-6);
 if(gr()<.1+d*.08+.02*save.up.luck)items.push({type:'gem',x:grnd(40,140),y:y0-14,ph:gr()*6});
 else if(gr()<(hard?.12:fl<150?.09:.055))items.push({type:'shield',x:grnd(50,130),y:y0-14,ph:0});
}
function generate(){while(genY>camY-220){genChunk(genY);genY-=CH;}}
function cleanup(){const lim=camY+H+100;wallD=wallD.filter(d=>d.y1<lim);midD=midD.filter(m=>m.y<lim);hz=hz.filter(h=>(h.y1!==undefined?h.y1:h.y-30)<lim);coins=coins.filter(o=>o.y<lim);items=items.filter(o=>o.y<lim);}
function clearRange(a,b){hz=hz.filter(h=>{const t=h.y1!==undefined?h.y1:h.y-16,bt=h.y2!==undefined?h.y2:h.y+16;return bt<a||t>b;});}

/* ---------- 파티클 ---------- */
function burst(x,y,n,cols,sp,life,g){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*(.6+Math.random()*.6),max:life,col:cols[i%cols.length],sz:Math.random()<.3?2:1,g:g==null?120:g});}}
function updParts(dt){for(const p of parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}parts=parts.filter(p=>p.life>0);if(parts.length>450)parts.splice(0,parts.length-450);}

/* ---------- 고양이 조작 ---------- */
function jump(){
 const c=cat;
 if(c.mode==='wall'||c.mode==='ground'){
  const dir=c.mode==='wall'?(c.side==='L'?1:-1):c.face;
  c.mode='air';c.vx=dir*225;c.vy=jvy();c.side=null;c.face=dir;c.dj=true;c.spinT=0;c.snow=false;
  burst(c.x-dir*8,c.y+6,7,['#ffffff','#dfe6ee'],45,.35,20);sfx('jump');save.stats.jumps++;
 }else if(c.mode==='air'){
  if(c.dj){c.dj=false;c.vy=djvy();c.spinT=.42;save.stats.dj++;sfx('dj');
   for(let k=0;k<12;k++){const a=k/12*Math.PI*2;parts.push({x:c.x,y:c.y+4,vx:Math.cos(a)*55,vy:Math.sin(a)*25+20,life:.35,max:.35,col:k%2?'#ffffff':'#ffe9a0',sz:1,g:0});}}
  else c.buf=.12;
 }
}
function land(side){const c=cat;c.mode='wall';c.side=side;c.x=side==='L'?LX+CLING:RX-CLING;c.vx=0;c.vy=0;c.at=0;c.land=.14;c.dj=true;c.spinT=0;
 burst(c.x+(side==='L'?-9:9),c.y,6,['#ffffff','#cfd8e2'],40,.3,0);sfx('land');}
function snowAt(side,y){for(const h of hz)if(h.type==='snow'&&h.side===side&&y>h.y1-4&&y<h.y2+4)return h;return null;}
function laserState(h){const p=((runT+h.ph)%h.per+h.per)%h.per;return p<h.per*.5?'off':p<h.per*.74?'warn':'on';}
function hit(){
 const c=cat;if(c.inv>0)return;
 if(EV&&EV.kind==='tag'){c.inv=.5;return;}
 if(c.shield){c.shield=false;c.inv=1.3;burst(c.x,c.y,22,['#ffe14a','#ffffff'],110,.6,40);sfx('shield');shake=.2;return;}
 if(boss&&!boss.dead&&bossHearts>1){bossHearts--;c.inv=1.6;burst(c.x,c.y,18,['#ff5a7a','#ffffff'],90,.5,40);sfx('hit');shake=.25;vib(80);return;}
 die(false);
}
function die(fall){
 if(EV&&EV.kind==='race'&&!EV.dead){EV.dead=true;EV.result=evPlace();}
 if(EV&&EV.kind==='boss'&&!EV.dead){EV.dead=true;}
 const c=cat;c.mode='dead';state='dying';dyingT=0;c.vx=fall?0:(c.x<MX?60:-60);c.vy=fall?-40:-200;c.spin=0;
 if(!fall)burst(c.x,c.y,18,['#ffe14a','#ffffff','#ff7a7a'],90,.7,60);
 shake=.35;sfx('die');vib(120);$('hint').style.display='none';
}
function collect(){
 const c=cat,R=pickR();
 for(let k=coins.length-1;k>=0;k--){const o=coins[k];if(Math.abs(o.x-c.x)<R&&Math.abs(o.y-c.y)<R+2){coins.splice(k,1);runCoins++;burst(o.x,o.y,4,['#ffe14a','#fff6a0'],40,.3,0);sfx('coin');}}
 for(let k=items.length-1;k>=0;k--){const o=items[k];if(Math.abs(o.x-c.x)<R+1&&Math.abs(o.y-c.y)<R+3){items.splice(k,1);
  if(o.type==='gem'){runGems++;burst(o.x,o.y,10,['#3fe0ff','#ffffff'],60,.5,0);sfx('gem');}
  else if(o.type==='candy'){runCandy+=1;burst(o.x,o.y,6,['#ff7ab8','#ffe14a'],50,.4,0);sfx('candy');}
  else if(o.type==='orb'){rockets.push({x:o.x,y:o.y});burst(o.x,o.y,12,['#ffd23f','#ffffff'],70,.5,0);sfx('gem');}
  else{c.shield=true;burst(o.x,o.y,12,['#ffe14a','#ffffff'],60,.5,0);sfx('gem');}}}
}
function collide(){
 const c=cat;collect();if(pumpkinT>0)return;
 for(const h of hz){
  if(h.type==='saw'){const dx=h.x-c.x,dy=h.y-c.y;if(dx*dx+dy*dy<(h.r+6)*(h.r+6)){hit();return;}}
  else if(h.type==='spikes'){if(c.y>h.y1-6&&c.y<h.y2+6&&((h.side==='L'&&c.x<LX+17)||(h.side==='R'&&c.x>RX-17))){hit();return;}}
  else if(h.type==='laser'){const[x0,x1]=laserSpan(h);if(laserState(h)==='on'&&Math.abs(c.y-h.y)<8&&c.x>x0-4&&c.x<x1+4){hit();return;}}
  else if(h.type==='bird'||h.type==='bat'){if(Math.abs(h.x-c.x)<11&&Math.abs(h.y-c.y)<9){hit();return;}}
  else if(h.type==='ghost'){if(Math.hypot(h.x-c.x,h.y-c.y)<12){hit();return;}}
  else if(h.type==='arm'){if(h.reach>.4&&Math.abs(h.y-c.y)<12){const hx=h.side==='L'?LX+10+h.reach*20:RX-10-h.reach*20;if(h.side==='L'?c.x<hx:c.x>hx){hit();return;}}}
  else if(h.type==='meteor'){if(!h.warn&&Math.hypot(h.x-c.x,h.y-c.y)<11){hit();return;}}
  else if(h.type==='mine'){const mx=h.side==='L'?LX+3:RX-3;if(!h.boom&&Math.hypot(mx-c.x,h.y-c.y)<13){h.boom=.6;burst(mx,h.y,45,['#ff6a2a','#ffe14a','#ffffff','#3a3a3a','#ff3a1a'],190,.8,80);burst(mx,h.y,16,['#5a5a5a','#2a2a2a'],90,1.1,-20);sfx('boom');setTimeout(()=>sfx('boom'),90);shake=.5;vib([60,30,120]);hit();return;}}
  else if(h.type==='spinbar'){const a=h.rot,ca=Math.cos(a),sa=Math.sin(a),dx=c.x-h.x,dy=c.y-h.y,u=dx*ca+dy*sa,v=-dx*sa+dy*ca;if(Math.abs(u)<h.len&&Math.abs(v)<5){hit();return;}}
  else if(h.type==='portal'){if(Math.hypot(h.x-c.x,h.y-c.y)<18&&!portalGo){portalGo=true;enterPortal();return;}}
  else if(h.type==='cannon'){if(c.mode==='air'&&Math.abs(h.x-c.x)<12&&Math.abs(h.y-c.y)<13){enterCannon(h);return;}}
 }
}
function enterCannon(h){const c=cat;c.mode='cannon';c.can=h;c.ct=.55;c.x=h.x;c.y=h.y;h.shake=.55;sfx('land');}
function fireCannon(){
 const c=cat,h=c.can;c.mode='launch';c.vy=-620;const dist=(42+Math.random()*22)*FPX;c.ty=c.y-dist;
 calm.push([c.ty-210,c.ty+130]);clearRange(c.ty-210,c.ty+130);
 burst(h.x,h.y-8,20,['#ffffff','#d8d8d8','#ffb04a','#ff6a2a'],90,.6,-20);shake=.3;sfx('boom');vib(60);
}

/* ---------- 보스 ---------- */
function updBoss(dt){
 const b=boss;b.t+=dt;b.flash=Math.max(0,b.flash-dt);
 b.x=MX+Math.sin(b.t*.8)*44;b.y=camY+50+Math.sin(b.t*2.2)*4;
 if(b.dead){b.deadT+=dt;if(Math.random()<dt*20)burst(b.x+rnd(-25,25),b.y+rnd(-20,20),6,['#ffe14a','#ff7a2a','#ffffff'],80,.5,0);if(b.deadT>1.8&&state==='play')showOver(true);return;}
 b.atk-=dt;
 if(b.atk<=0){b.n=(b.n||0)+1;const st=b.st;
  if(b.def.shot==='feather'||b.n%3===0){for(let i=-1;i<=1;i++)shots.push({k:'feather',x:b.x+i*12,y:b.y+12,vx:i*22,vy:b.def.easy?55:50+st*10,g:50,r:0});}
  if(b.def.shot==='bat'){for(let i=0;i<5;i++){const a=Math.PI*(.3+i*.1);shots.push({k:'bat',x:b.x,y:b.y+10,vx:Math.cos(a)*62,vy:Math.sin(a)*62,g:0,r:0});}}
  if(b.def.shot==='bomb'){const dx=cat.x-b.x,dy=cat.y-b.y,L=Math.hypot(dx,dy)||1;shots.push({k:'bomb',x:b.x,y:b.y+10,vx:dx/L*92,vy:dy/L*92,g:0,r:0});shots.push({k:'bomb',x:rnd(LX+20,RX-20),y:b.y,vx:0,vy:90,g:40,r:0});}
  b.atk=b.def.easy?rnd(2.6,3.4):rnd(2.5,3.3)-st*.15;}
 b.orbT-=dt;
 if(b.orbT<=0){if(items.filter(o=>o.type==='orb').length<3)items.push({type:'orb',x:rnd(LX+22,RX-22),y:camY+H*rnd(.18,.36),ph:0});b.orbT=rnd(1.5,2.2);}
 for(const s of shots){s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=dt*6;}
 shots=shots.filter(s=>s.y<camY+H+30&&s.x>-20&&s.x<W+20);
 if(cat.mode==='wall'||cat.mode==='air')for(const s of shots){if(Math.hypot(s.x-cat.x,s.y-cat.y)<8){hit();break;}}
 for(const r of rockets){const dx=b.x-r.x,dy=b.y-r.y,L=Math.hypot(dx,dy)||1;r.x+=dx/L*300*dt;r.y+=dy/L*300*dt;
  if(Math.random()<.6)parts.push({x:r.x,y:r.y,vx:rnd(-10,10),vy:rnd(-10,10),life:.3,max:.3,col:'#ffe14a',sz:1,g:0});
  if(L<14){r.done=true;b.hp--;if(EV&&EV.kind==='boss'){EV.dmg=(EV.dmg||0)+1;evBroadcast();evBossSync();}b.flash=.25;burst(b.x,b.y,16,['#ffe14a','#ffffff','#ff7a7a'],90,.5,40);sfx('hit');shake=.15;
   if(b.hp<=0){b.dead=true;b.deadT=0;shots=[];sfx('boom');shake=.5;}}}
 rockets=rockets.filter(r=>!r.done);
}

/* ---------- 업데이트 ---------- */
function updHazards(dt){
 for(const h of hz){
  if(h.type==='saw'){if(h.ax==='x')h.x=h.bx+Math.sin(runT*h.sp+h.ph)*h.amp;else if(h.ax==='y')h.y=h.by+Math.sin(runT*h.sp+h.ph)*h.amp;h.rot+=dt*8;}
  else if(h.type==='bird'||h.type==='bat'){h.x+=h.dir*h.sp*dt;if(h.x<LX+12){h.x=LX+12;h.dir=1;}if(h.x>RX-12){h.x=RX-12;h.dir=-1;}h.fa+=dt;if(h.type==='bat')h.y=h.by+Math.sin(runT*4+h.fa)*5;}
  else if(h.type==='ghost'){h.x=h.bx+Math.sin(runT*h.sp+h.ph)*h.amp;h.y=h.by+Math.sin(runT*2+h.ph)*6;}
  else if(h.type==='cannon')h.shake=Math.max(0,h.shake-dt);
  else if(h.type==='meteor'){if(h.warn>0){h.warn-=dt;h.y=camY-24;if(h.warn<=0)h.warn=0;}else{h.y+=h.vy*dt;h.rot=(h.rot||0)+dt*4;if(Math.random()<.7)parts.push({x:h.x+rnd(-3,3),y:h.y-8,vx:rnd(-8,8),vy:-30,life:.45,max:.45,col:['#ff8a1a','#ffe14a','#ff4a1a','#8a8a8a'][Math.random()*4|0],sz:2,g:0});}}
  else if(h.type==='mine'&&h.boom){h.boom-=dt;if(h.boom<=0)h.dead=1;}
  else if(h.type==='spinbar')h.rot+=h.sp*dt;
  else if(h.type==='arm'){const p=((runT+h.ph)%2.6+2.6)%2.6;h.reach=p<1.2?0:p<1.45?(p-1.2)/.25:p<2.1?1:p<2.5?1-(p-2.1)/.4:0;h.warn=p>.8&&p<1.2;}

const FB=String(window.FIREBASE_URL||'').trim().replace(/\/+$/,'');
const fbKey=s=>String(s).replace(/[.#$\[\]\/]/g,'_');
function fbReq(path,method,body,keep){return fetch(FB+'/'+path+'.json',{method,body:body===undefined?undefined:JSON.stringify(body),keepalive:!!keep}).then(r=>r.ok?r.json():Promise.reject(r.status));}
const FB_PEER=Array.from({length:16},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.random()*36|0]).join('');
const fbOpen=new Set();
window.addEventListener('pagehide',()=>{fbOpen.forEach(r=>r._del(true));});
function fbRoom(name){
 const path='rooms/'+fbKey(name);let tree={},mine={},hs=[],ces=[],es=null,last=0,timer=null,closed=false,snap=[],fq=false,hb=null;const chg={};
 const room={name,
  presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k];}schedule();rebuild();return Promise.resolve();},
  peers(){return snap;},
  onPeers(h){hs.push(h);setTimeout(()=>h({peers:snap,joined:snap,left:[],updated:[]}),0);return()=>{hs=hs.filter(x=>x!==h);};},
  connected(){return!!es&&es.readyState===1;},
  onConnection(h){ces.push(h);return()=>{};},
  emit(){return Promise.resolve();},on(){return()=>{};},
  join(n){return Promise.resolve(fbRoom(n));},
  leave(){closed=true;fbOpen.delete(room);if(es)es.close();clearInterval(hb);room._del(false);return Promise.resolve();},
  _del(keep){fbReq(path+'/'+FB_PEER,'DELETE',undefined,keep).catch(()=>{});}};
 let inF=false,dirty=false;function send(){last=Date.now();timer=null;if(closed)return;if(inF){dirty=true;return;}inF=true;dirty=false;fbReq(path+'/'+FB_PEER,'PUT',{p:mine,t:Date.now()}).catch(()=>{}).finally(()=>{inF=false;if(dirty&&!closed)schedule();});}
 function schedule(){if(timer)return;timer=setTimeout(send,Math.max(0,150-(Date.now()-last)));}
 function fire(){if(fq)return;fq=true;setTimeout(()=>{fq=false;hs.forEach(h=>{try{h({peers:snap,joined:[],left:[],updated:[]});}catch(e){}});},0);}
 function rebuild(){
  const now=Date.now(),list=[],all=Object.assign({},tree);all[FB_PEER]={p:mine,t:now};
  for(const k in all){const v=all[k];if(!v||typeof v!=='object')continue;const t=Number(v.t)||0;
   const sa=chg['s'+k];if(!sa||sa.t!==t)chg['s'+k]={t,at:now};const alive=now-chg['s'+k].at<25000||Math.abs((typeof svNow==='function'?svNow():now)-t)<25000;
   if(k!==FB_PEER&&!alive){if(now-t>120000&&!chg['x'+k]){chg['x'+k]=1;fbReq(path+'/'+k,'DELETE').catch(()=>{});}continue;}
   const pres=v.p&&typeof v.p==='object'?v.p:{},key=JSON.stringify(pres);if(chg[k]!==key){chg[k]=key;chg['u'+k]=now;}
   list.push({peer:k,by:null,isMe:k===FB_PEER,sameTab:k===FB_PEER,kind:'viewer',guest:false,presence:pres,updatedAt:chg['u'+k]||now});}
  snap=list;fire();}
 function setAt(p,val){const ks=String(p).split('/').filter(Boolean);
  if(!ks.length){tree=val&&typeof val==='object'?val:{};return;}
  let o=tree;for(let i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]];}
  const lk=ks[ks.length-1];if(val===null)delete o[lk];else o[lk]=val;}
 try{es=new EventSource(FB+'/'+path+'.json');
  es.addEventListener('put',e=>{try{const d=JSON.parse(e.data);setAt(d.path,d.data);rebuild();}catch(x){}});
  es.addEventListener('patch',e=>{try{const d=JSON.parse(e.data);for(const k in d.data)setAt(String(d.path).replace(/\/$/,'')+'/'+k,d.data[k]);rebuild();}catch(x){}});
  es.onopen=()=>ces.forEach(h=>h(true));}catch(e){}
 hb=setInterval(()=>{if(!closed){send();rebuild();}},10000);
 fbOpen.add(room);send();return room;
}
function fbDB(){return{collection(c){return{
 doc(id){return{set(o){return fbReq(fbKey(c)+'/'+fbKey(id),'PUT',o);}};},
 orderBy(f){const q={f,n:50};const api={limit(n){q.n=n;return api;},get(){return fbReq(fbKey(c),'GET').then(v=>{
  const arr=Object.keys(v||{}).filter(k=>v[k]&&typeof v[k]==='object').map(k=>({id:k,data:()=>v[k]}));
  arr.sort((a,b)=>(Number(b.data()[q.f])||0)-(Number(a.data()[q.f])||0));const docs=arr.slice(0,q.n);return{docs,size:docs.length,empty:!docs.length};});}};return api;}};}};}

 if(a.dead){a.y+=140*dt;v.gx=a.x;v.gy=a.y;v.gm=4;return;}
 a.t-=dt;a.spin=Math.max(0,a.spin-dt);

  if(a.t<=0){const dir=a.m==='wall'?(a.side==='L'?1:-1):1;a.m='air';a.vx=dir*225;a.vy=-360;a.dj=true;a.side=null;}}

 v.gx=a.x;v.gy=a.y;v.gm=a.m==='ground'?0:a.m==='wall'?1:(a.spin>0?3:2);v.gs=a.side||'R';v.gf=a.vx<0?-1:1;}

 if(inv&&me.presence.q){seenInv['m'+inv.presence.m.room]=1;qT=0;lobbyUpdate({q:null});joinMatch(inv.presence.m.room,'random','');return;}

}

function press(){if(BANNED_DEV||LOCKED)return;audio();
 if(state==='ready'){state='play';$('hint').style.display='none';jump();}
 else if(state==='play'){if(cat&&cat.mode==='ground')$('hint').style.display='none';jump();}
 else if(state==='tag')tagJump();}
stage.addEventListener('pointerdown',e=>{if(e.target!==canvas)return;e.preventDefault();press();});
stage.addEventListener('click',e=>{const t=e.target.closest('[data-open],[data-act]');if(!t||t.disabled)return;audio();
 if(t.dataset.open){sfx('click');openPanel(t.dataset.open);}else if(ACT[t.dataset.act])ACT[t.dataset.act](t.dataset.arg,t);if(t.blur)t.blur();});
window.addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 const k=e.code;
 if(state==='tag'){if(k==='ArrowLeft'||k==='KeyA'){tagMove(-1);e.preventDefault();return;}if(k==='ArrowRight'||k==='KeyD'){tagMove(1);e.preventDefault();return;}if(k==='Space'||k==='ArrowUp'||k==='KeyW'){tagJump();e.preventDefault();return;}}
 if(k==='Space'||k==='ArrowUp'||k==='KeyW'){e.preventDefault();
  if(state==='ready'||state==='play')press();
  else if(state==='over'&&overT>.6&&!e.repeat)ACT.retry();
  else if(state==='paused'&&!e.repeat)togglePause();}
 else if(k==='KeyE'){if(state==='play')useSlot(0);}
 else if(k==='KeyR'){if(state==='play')useSlot(1);}
 else if(k==='Escape'||k==='KeyP'){if(['play','ready','paused'].includes(state))togglePause();else if($('modal').classList.contains('on'))closeModal();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='ready'))togglePause();if(AC){if(document.hidden)AC.suspend();else AC.resume();}});

function resize(){
 const r=$('app').getBoundingClientRect(),vw=Math.max(1,r.width),vh=Math.max(1,r.height);let sw,sh;
 if(vw/vh<W/320){sw=vw;H=Math.round(clamp(W*vh/vw,320,400));sh=sw*H/W;if(sh>vh){sh=vh;sw=sh*W/H;}}
 else{H=320;sh=vh;sw=sh*W/H;}
 S=clamp(Math.round(sw*Math.min(2,window.devicePixelRatio||1)/W),2,3);canvas.width=W*S;canvas.height=H*S;ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
 stage.style.width=Math.floor(sw)+'px';stage.style.height=Math.floor(sh)+'px';
 document.documentElement.style.setProperty('--u',(sw/W)+'px');
 if(state==='home')camY=-(H-70);
}
