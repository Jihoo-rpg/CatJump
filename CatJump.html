/* ---------- 레벨 생성 ---------- */
function pickW(opts){let t=0;for(const o of opts)t+=Math.max(0,o[1]);let x=gr()*t;for(const o of opts){x-=Math.max(0,o[1]);if(x<=0)return o[0];}return opts[0][0];}
function coinCol(side,y,n){const x=side==='L'?LX+CLING:RX-CLING;for(let k=0;k<n;k++)coins.push({x,y:y-k*15,ph:gr()*6});}
function coinArc(y,dir){let x=dir>0?LX+CLING:RX-CLING,yy=y,vy=-360;const vx=dir*225;for(let k=0;k<7;k++){const t=.075;x+=vx*t;vy+=GRAV*t;yy+=vy*t;if(x>LX+14&&x<RX-14)coins.push({x,y:yy,ph:k*.5});}}
function coinPattern(y){if(gr()<.45)coinCol(gr()<.5?'L':'R',y,3+(gr()*3|0));else coinArc(y,gr()<.5?1:-1);}
function candyPattern(y){const n=2+(gr()*3|0),x0=grnd(40,140-n*12);for(let k=0;k<n;k++)items.push({type:'candy',x:x0+k*13,y:y-Math.sin(k)*4,ph:k});}
function genChunk(y0){
 const yT=y0-CH,ym=y0-CH/2,fl=-ym/FPX,hw=fl>=100;
 let d=clamp(fl/500,0,1);if(mode==='hard')d=Math.min(1.25,d+.35);
 const calmHere=calm.some(([a,b])=>yT<b&&y0>a);
 if(y0>-560||calmHere){coinPattern(y0-20);if(hw)candyPattern(y0-70);return;}
 if(mode==='boss'){coinPattern(y0-20);if(fl>8&&gr()<.35){const sd=gr()<.5?'L':'R';if(gr()<.5)hz.push({type:'spikes',side:sd,y1:ym-24,y2:ym+24});else hz.push({type:'snow',side:sd,y1:ym-40,y2:ym+40});}return;}
 const opts=[['saw',2.5],['spikes',3],['coins',Math.max(.8,3-d*2.4)]];
 if(fl>35)opts.push(['snow',1.6]);
 if(fl>200)opts.push(['laser',1+1.2*d]);
 if(fl>50)opts.push(['bird',.9+d]);
 if(hw)opts.push(['ghost',1.3+d]);
 if(fl>80)opts.push(['wallsaw',.8+1.6*d]);
 if(fl>25&&lastCannon-ym>1600)opts.push(['cannon',1.1]);
 if(fl>150)opts.push(['combo',2*d]);
 const type=pickW(opts),side=gr()<.5?'L':'R',other=side==='L'?'R':'L';
 const saw=(bx,by,ax,amp,sp)=>({type:'saw',bx,by,x:bx,y:by,r:9,ax,amp:amp||0,sp:sp||0,ph:grnd(0,6),rot:0});
 switch(type){
  case'saw':{let s=saw(grnd(52,128),ym,null);if(fl>60&&gr()<.45){s.ax='x';s.amp=grnd(18,34);s.sp=grnd(1.2,2.2);s.bx=s.x=clamp(s.bx,LX+18+s.amp,RX-18-s.amp);}hz.push(s);
   if(d>.5&&gr()<.3)hz.push(saw(grnd(52,128),ym-50,null));break;}
  case'spikes':{const sd=gr()<.65?(lastSpikeSide==='L'?'R':'L'):lastSpikeSide;lastSpikeSide=sd;const len=40+d*34+grnd(0,16);
   hz.push({type:'spikes',side:sd,y1:ym-len/2,y2:ym+len/2});coinCol(sd==='L'?'R':'L',ym+20,3);break;}
  case'snow':{const len=grnd(60,105);hz.push({type:'snow',side,y1:ym-len/2,y2:ym+len/2});coinCol(side,ym+10,2);break;}
  case'laser':{const per=2.7-Math.min(1,d)*.6;hz.push({type:'laser',y:ym,per,ph:grnd(0,per)});break;}
  case'bird':hz.push({type:hw?'bat':'bird',x:grnd(40,140),y:ym,by:ym,dir:gr()<.5?-1:1,sp:32+d*34,fa:gr()});break;
  case'ghost':hz.push({type:'ghost',bx:grnd(60,120),x:MX,by:ym,y:ym,amp:grnd(25,45),sp:grnd(.9,1.5),ph:grnd(0,6)});break;
  case'wallsaw':{const s=saw(side==='L'?LX:RX,ym,'y',28+d*18,1.5+d);hz.push(s);coinCol(other,ym,3);break;}
  case'cannon':hz.push({type:'cannon',x:grnd(62,118),y:ym,shake:0});lastCannon=ym;coinArc(ym+40,gr()<.5?1:-1);break;
  case'combo':{hz.push({type:'spikes',side,y1:ym+5,y2:ym+50});const s=saw(grnd(60,120),ym-36,'x',22,1.6);hz.push(s);break;}
  default:coinPattern(ym+30);coinPattern(ym-30);}
 if(type!=='coins'&&type!=='cannon'&&gr()<.55)coinPattern(y0-12);
 if(hw&&(mode==='halloween'||gr()<.7))candyPattern(y0-6);
 if(gr()<.1+d*.08+.02*save.up.luck)items.push({type:'gem',x:grnd(40,140),y:y0-14,ph:gr()*6});
 else if(gr()<(fl<80?.09:.04))items.push({type:'shield',x:grnd(50,130),y:y0-14,ph:0});
}
function generate(){while(genY>camY-220){genChunk(genY);genY-=CH;}}
function cleanup(){const lim=camY+H+100;hz=hz.filter(h=>(h.y1!==undefined?h.y1:h.y-30)<lim);coins=coins.filter(o=>o.y<lim);items=items.filter(o=>o.y<lim);}
function clearRange(a,b){hz=hz.filter(h=>{const t=h.y1!==undefined?h.y1:h.y-16,bt=h.y2!==undefined?h.y2:h.y+16;return bt<a||t>b;});}

/* ---------- 파티클 ---------- */
function burst(x,y,n,cols,sp,life,g){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*(.6+Math.random()*.6),max:life,col:cols[i%cols.length],sz:Math.random()<.3?2:1,g:g==null?120:g});}}
function updParts(dt){for(const p of parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}parts=parts.filter(p=>p.life>0);if(parts.length>450)parts.splice(0,parts.length-450);}

/* ---------- 고양이 조작 ---------- */
function jump(){
 const c=cat;
 if(c.mode==='wall'||c.mode==='ground'){
  const dir=c.mode==='wall'?(c.side==='L'?1:-1):c.face;
  c.mode='air';c.vx=dir*225;c.vy=jvy();c.side=null;c.face=dir;c.dj=true;c.spinT=0;c.snow=false;
  burst(c.x-dir*8,c.y+6,7,['#ffffff','#dfe6ee'],45,.35,20);sfx('jump');save.stats.jumps++;
 }else if(c.mode==='air'){
  if(c.dj){c.dj=false;c.vy=djvy();c.spinT=.42;save.stats.dj++;sfx('dj');
   for(let k=0;k<12;k++){const a=k/12*Math.PI*2;parts.push({x:c.x,y:c.y+4,vx:Math.cos(a)*55,vy:Math.sin(a)*25+20,life:.35,max:.35,col:k%2?'#ffffff':'#ffe9a0',sz:1,g:0});}}
  else c.buf=.12;
 }
}
function land(side){const c=cat;c.mode='wall';c.side=side;c.x=side==='L'?LX+CLING:RX-CLING;c.vx=0;c.vy=0;c.at=0;c.land=.14;c.dj=true;c.spinT=0;
 burst(c.x+(side==='L'?-9:9),c.y,6,['#ffffff','#cfd8e2'],40,.3,0);sfx('land');}
function snowAt(side,y){for(const h of hz)if(h.type==='snow'&&h.side===side&&y>h.y1-4&&y<h.y2+4)return h;return null;}
function laserState(h){const p=((runT+h.ph)%h.per+h.per)%h.per;return p<h.per*.5?'off':p<h.per*.74?'warn':'on';}
function hit(){
 const c=cat;if(c.inv>0)return;
 if(c.shield){c.shield=false;c.inv=1.3;burst(c.x,c.y,22,['#ffe14a','#ffffff'],110,.6,40);sfx('shield');shake=.2;return;}
 die(false);
}
function die(fall){
 const c=cat;c.mode='dead';state='dying';dyingT=0;c.vx=fall?0:(c.x<MX?60:-60);c.vy=fall?-40:-200;c.spin=0;
 if(!fall)burst(c.x,c.y,18,['#ffe14a','#ffffff','#ff7a7a'],90,.7,60);
 shake=.35;sfx('die');vib(120);$('hint').style.display='none';
}
function collect(){
 const c=cat,R=pickR();
 for(let k=coins.length-1;k>=0;k--){const o=coins[k];if(Math.abs(o.x-c.x)<R&&Math.abs(o.y-c.y)<R+2){coins.splice(k,1);runCoins++;burst(o.x,o.y,4,['#ffe14a','#fff6a0'],40,.3,0);sfx('coin');}}
 for(let k=items.length-1;k>=0;k--){const o=items[k];if(Math.abs(o.x-c.x)<R+1&&Math.abs(o.y-c.y)<R+3){items.splice(k,1);
  if(o.type==='gem'){runGems++;burst(o.x,o.y,10,['#3fe0ff','#ffffff'],60,.5,0);sfx('gem');}
  else if(o.type==='candy'){runCandy+=mode==='halloween'?2:1;burst(o.x,o.y,6,['#ff7ab8','#ffe14a'],50,.4,0);sfx('candy');}
  else if(o.type==='orb'){rockets.push({x:o.x,y:o.y});burst(o.x,o.y,12,['#ffd23f','#ffffff'],70,.5,0);sfx('gem');}
  else{c.shield=true;burst(o.x,o.y,12,['#ffe14a','#ffffff'],60,.5,0);sfx('gem');}}}
}
function collide(){
 const c=cat;collect();
 for(const h of hz){
  if(h.type==='saw'){const dx=h.x-c.x,dy=h.y-c.y;if(dx*dx+dy*dy<(h.r+5)*(h.r+5)){hit();return;}}
  else if(h.type==='spikes'){if(c.y>h.y1-6&&c.y<h.y2+6&&((h.side==='L'&&c.x<LX+19)||(h.side==='R'&&c.x>RX-19))){hit();return;}}
  else if(h.type==='laser'){if(laserState(h)==='on'&&Math.abs(c.y-h.y)<7){hit();return;}}
  else if(h.type==='bird'||h.type==='bat'){if(Math.abs(h.x-c.x)<12&&Math.abs(h.y-c.y)<9){hit();return;}}
  else if(h.type==='ghost'){if(Math.hypot(h.x-c.x,h.y-c.y)<12){hit();return;}}
  else if(h.type==='cannon'){if(c.mode==='air'&&Math.abs(h.x-c.x)<12&&Math.abs(h.y-c.y)<13){enterCannon(h);return;}}
 }
}
function enterCannon(h){const c=cat;c.mode='cannon';c.can=h;c.ct=.55;c.x=h.x;c.y=h.y;h.shake=.55;sfx('land');}
function fireCannon(){
 const c=cat,h=c.can;c.mode='launch';c.vy=-620;const dist=(42+Math.random()*22)*FPX;c.ty=c.y-dist;
 calm.push([c.ty-210,c.ty+130]);clearRange(c.ty-210,c.ty+130);
 burst(h.x,h.y-8,20,['#ffffff','#d8d8d8','#ffb04a','#ff6a2a'],90,.6,-20);shake=.3;sfx('boom');vib(60);
}

/* ---------- 보스 ---------- */
function updBoss(dt){
 const b=boss;b.t+=dt;b.flash=Math.max(0,b.flash-dt);
 b.x=MX+Math.sin(b.t*.8)*44;b.y=camY+50+Math.sin(b.t*2.2)*4;
 if(b.dead){b.deadT+=dt;if(Math.random()<dt*20)burst(b.x+rnd(-25,25),b.y+rnd(-20,20),6,['#ffe14a','#ff7a2a','#ffffff'],80,.5,0);if(b.deadT>1.8&&state==='play')showOver(true);return;}
 b.atk-=dt;
 if(b.atk<=0){b.n=(b.n||0)+1;const st=b.st;
  if(b.def.shot==='feather'||b.n%3===0){for(let i=-1;i<=1;i++)shots.push({k:'feather',x:b.x+i*12,y:b.y+12,vx:i*22,vy:70+st*18,g:50,r:0});}
  if(b.def.shot==='bat'){for(let i=0;i<5;i++){const a=Math.PI*(.3+i*.1);shots.push({k:'bat',x:b.x,y:b.y+10,vx:Math.cos(a)*95,vy:Math.sin(a)*95,g:0,r:0});}}
  if(b.def.shot==='bomb'){const dx=cat.x-b.x,dy=cat.y-b.y,L=Math.hypot(dx,dy)||1;shots.push({k:'bomb',x:b.x,y:b.y+10,vx:dx/L*135,vy:dy/L*135,g:0,r:0});shots.push({k:'bomb',x:rnd(LX+20,RX-20),y:b.y,vx:0,vy:90,g:40,r:0});}
  b.atk=rnd(1.7,2.5)-st*.3;}
 b.orbT-=dt;
 if(b.orbT<=0){if(items.filter(o=>o.type==='orb').length<2)items.push({type:'orb',x:rnd(LX+22,RX-22),y:camY+H*rnd(.18,.36),ph:0});b.orbT=rnd(2.4,3.4);}
 for(const s of shots){s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=dt*6;}
 shots=shots.filter(s=>s.y<camY+H+30&&s.x>-20&&s.x<W+20);
 if(cat.mode==='wall'||cat.mode==='air')for(const s of shots){if(Math.hypot(s.x-cat.x,s.y-cat.y)<9){hit();break;}}
 for(const r of rockets){const dx=b.x-r.x,dy=b.y-r.y,L=Math.hypot(dx,dy)||1;r.x+=dx/L*300*dt;r.y+=dy/L*300*dt;
  if(Math.random()<.6)parts.push({x:r.x,y:r.y,vx:rnd(-10,10),vy:rnd(-10,10),life:.3,max:.3,col:'#ffe14a',sz:1,g:0});
  if(L<14){r.done=true;b.hp--;b.flash=.25;burst(b.x,b.y,16,['#ffe14a','#ffffff','#ff7a7a'],90,.5,40);sfx('hit');shake=.15;
   if(b.hp<=0){b.dead=true;b.deadT=0;shots=[];sfx('boom');shake=.5;}}}
 rockets=rockets.filter(r=>!r.done);
}

/* ---------- 업데이트 ---------- */
function updHazards(dt){
 for(const h of hz){
  if(h.type==='saw'){if(h.ax==='x')h.x=h.bx+Math.sin(runT*h.sp+h.ph)*h.amp;else if(h.ax==='y')h.y=h.by+Math.sin(runT*h.sp+h.ph)*h.amp;h.rot+=dt*8;}
  else if(h.type==='bird'||h.type==='bat'){h.x+=h.dir*h.sp*dt;if(h.x<LX+12){h.x=LX+12;h.dir=1;}if(h.x>RX-12){h.x=RX-12;h.dir=-1;}h.fa+=dt;if(h.type==='bat')h.y=h.by+Math.sin(runT*4+h.fa)*5;}
  else if(h.type==='ghost'){h.x=h.bx+Math.sin(runT*h.sp+h.ph)*h.amp;h.y=h.by+Math.sin(runT*2+h.ph)*6;}
  else if(h.type==='cannon')h.shake=Math.max(0,h.shake-dt);
 }
}
function updatePlay(dt){
 runT+=dt;updHazards(dt);
 const c=cat;c.inv=Math.max(0,c.inv-dt);c.buf=Math.max(0,c.buf-dt);c.at+=dt;c.land=Math.max(0,c.land-dt);c.spinT=Math.max(0,c.spinT-dt);
 if(c.mode==='wall'){
  c.snow=!!snowAt(c.side,c.y);
  c.y+=(c.snow?140:slideSpd())*dt;
  if(c.y>GROUND_Y)c.y=GROUND_Y;
  if(Math.random()<dt*(c.snow?24:5))parts.push({x:c.x+(c.side==='L'?-10:10),y:c.y-8,vx:rnd(-6,6),vy:rnd(-20,-5),life:.35,max:.35,col:c.snow?'#ffffff':'#d8d0c0',sz:1,g:40});
  if(c.buf>0){c.buf=0;jump();}
 }else if(c.mode==='air'){
  c.vy+=GRAV*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;
  if(c.vx>0&&c.x>=RX-CLING)land('R');else if(c.vx<0&&c.x<=LX+CLING)land('L');
  else if(c.y>=GROUND_Y&&c.vy>0){c.y=GROUND_Y;c.mode='ground';c.vx=0;c.vy=0;c.dj=true;sfx('land');if(c.buf>0){c.buf=0;jump();}}
 }else if(c.mode==='cannon'){c.ct-=dt;if(c.ct<=0)fireCannon();}
 else if(c.mode==='launch'){
  c.y+=c.vy*dt;collect();
  parts.push({x:c.x+rnd(-3,3),y:c.y+12,vx:rnd(-15,15),vy:rnd(20,60),life:.45,max:.45,col:Math.random()<.5?'#ffb04a':'#ffffff',sz:2,g:0});
  if(c.y<=c.ty){c.mode='air';c.face=Math.random()<.5?-1:1;c.vx=c.face*225;c.vy=-200;c.inv=1.1;c.dj=true;}
 }
 if(c.mode==='wall'||c.mode==='air')collide();
 if(boss)updBoss(dt);
 if(c.mode==='launch')camY=c.y-H*.45;
 else{const tgt=c.y-H*.58;if(tgt<camY)camY+=(tgt-camY)*Math.min(1,dt*13);}
 const f=floorOf(c.y);if(f>runFloor)runFloor=f;
 if(runFloor>=100&&!hwAnnounced&&mode!=='boss'){hwAnnounced=true;zoneT=2.8;save.stats.hw=1;const z=$('zone');z.innerHTML='🎃 할로윈 구역 돌입!<br><span style="font-size:60%">사탕을 모아 한정 스킨을 사세요</span>';z.style.display='block';sfx('zone');}
 generate();cleanup();
 if(c.mode!=='dead'&&c.y-camY>H+26)die(true);
 if(mode==='versus')vsTick(dt);
 if(save.breed==='golden'&&Math.random()<dt*8)parts.push({x:c.x+rnd(-9,9),y:c.y+rnd(-10,8),vx:0,vy:-8,life:.5,max:.5,col:'#fff6a0',sz:1,g:0});
}
function updateDying(dt){
 runT+=dt;updHazards(dt);dyingT+=dt;const c=cat;
 c.vy+=GRAV*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.spin+=dt*12;
 if(boss){for(const s of shots){s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;}}
 if(dyingT>1.1){if(mode==='versus')vsMeDead();else showOver(false);}
}
function updateElev(dt){
 const e=elev,c=cat;e.t+=dt;
 if(e.t<1.1){const p=ease(e.t/1.1);crane.x=lerp(-30,MX,p);crane.y=lerp(camY-20,e.by-26,p);c.x=MX;c.y=e.by-6;}
 else if(!e.released){
  const p=ease(clamp((e.t-1.1)/3.4,0,1));e.y=lerp(e.by,e.ty,p);e.x=MX+Math.sin(e.t*3)*6;
  crane.x=e.x;crane.y=e.y-26;c.x=e.x;c.y=e.y-6;camY=e.y-H*.55;runFloor=floorOf(e.y);
  if(Math.random()<dt*12)parts.push({x:e.x+rnd(-14,14),y:e.y-20,vx:rnd(-10,10),vy:rnd(30,60),life:.6,max:.6,col:'#ffffff',sz:1,g:0});
  if(e.t>=4.5){e.released=true;c.mode='air';c.x=e.x;c.y=e.y-8;c.face=-1;c.vx=-225;c.vy=-240;c.dj=true;crane.leaving=true;crane.vx=50;crane.vy=-60;
   state='play';$('elevMsg').style.display='none';burst(c.x,c.y,10,['#ffffff','#ffe14a'],60,.5,30);sfx('jump');}
 }
}
function updCrane(dt){if(crane&&crane.leaving){crane.x+=crane.vx*dt;crane.y+=crane.vy*dt;crane.vy-=20*dt;if(crane.y<camY-60||crane.x>W+60)crane=null;}}

/* ================= 렌더링 ================= */
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function drawCatAt(x,y,pose,fr,flip,ang,alpha,sc){const s=catSprite(pose,fr,save.breed,save.outfit);ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.translate(sn(x),sn(y));if(flip)ctx.scale(-1,1);if(ang)ctx.rotate(ang);if(sc)ctx.scale(sc,sc);ctx.drawImage(s,-COX,-COY);ctx.restore();}
function drawCrane(cx,cy,t){
 const X=sn(cx),Y=sn(cy),p=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(X+x,Y+y,w,h);};
 const K='#16161c',Wt='#ffffff',Wg='#d8dde6';
 p(-3,3,1,11,'#4a4a52');p(2,3,1,11,'#4a4a52');p(-4,13,2,1,'#4a4a52');p(2,13,2,1,'#4a4a52');
 p(-13,-2,5,4,K);p(-14,-1,2,3,K);
 const rows=[[-5,-6,6],[-4,-8,8],[-3,-9,9],[-2,-10,10],[-1,-10,10],[0,-10,10],[1,-10,10],[2,-9,9],[3,-8,8],[4,-6,6]];
 for(const[y,a,b]of rows)p(a-1,y-1,b-a+3,3,K);
 for(const[y,a,b]of rows)p(a,y,b-a+1,1,y>1?Wg:Wt);
 for(let k=0;k<10;k++)p(7+(k>>1),-4-k,2,1,K);
 p(10,-17,7,5,K);p(11,-16,5,3,Wt);p(12,-17,3,1,'#e02020');p(14,-15,1,1,K);p(17,-15,6,1,'#d8b040');p(17,-14,4,1,'#b89030');
 if(Math.sin(t*10)>0){for(let k=0;k<13;k++){const a=-7-sn(k*.5),b=4-sn(k*.85);p(a-1,-3-k,1,1,K);p(a,-3-k,Math.max(1,b-a+1),1,k>9?K:Wt);}}

/* ================= Firebase 연결 (GitHub 등 바깥에서 올릴 때) ================= */
const FB=String(window.FIREBASE_URL||'').trim().replace(/\/+$/,'');
const fbKey=s=>String(s).replace(/[.#$\[\]\/]/g,'_');
function fbReq(path,method,body,keep){return fetch(FB+'/'+path+'.json',{method,body:body===undefined?undefined:JSON.stringify(body),keepalive:!!keep}).then(r=>r.ok?r.json():Promise.reject(r.status));}
const FB_PEER=Array.from({length:16},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.random()*36|0]).join('');
const fbOpen=new Set();
window.addEventListener('pagehide',()=>{fbOpen.forEach(r=>r._del(true));});
function fbRoom(name){
 const path='rooms/'+fbKey(name);let tree={},mine={},hs=[],ces=[],es=null,last=0,timer=null,closed=false,snap=[],fq=false,hb=null;const chg={};
 const room={name,
  presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k];}schedule();rebuild();return Promise.resolve();},
  peers(){return snap;},
  onPeers(h){hs.push(h);setTimeout(()=>h({peers:snap,joined:snap,left:[],updated:[]}),0);return()=>{hs=hs.filter(x=>x!==h);};},
  connected(){return!!es&&es.readyState===1;},
  onConnection(h){ces.push(h);return()=>{};},
  emit(){return Promise.resolve();},on(){return()=>{};},
  join(n){return Promise.resolve(fbRoom(n));},
  leave(){closed=true;fbOpen.delete(room);if(es)es.close();clearInterval(hb);room._del(false);return Promise.resolve();},
  _del(keep){fbReq(path+'/'+FB_PEER,'DELETE',undefined,keep).catch(()=>{});}};
 function send(){last=Date.now();timer=null;if(closed)return;fbReq(path+'/'+FB_PEER,'PUT',{p:mine,t:Date.now()}).catch(()=>{});}
 function schedule(){if(timer)return;timer=setTimeout(send,Math.max(0,150-(Date.now()-last)));}
 function fire(){if(fq)return;fq=true;setTimeout(()=>{fq=false;hs.forEach(h=>{try{h({peers:snap,joined:[],left:[],updated:[]});}catch(e){}});},0);}
 function rebuild(){
  const now=Date.now(),list=[],all=Object.assign({},tree);all[FB_PEER]={p:mine,t:now};
  for(const k in all){const v=all[k];if(!v||typeof v!=='object')continue;const t=Number(v.t)||0;
   if(k!==FB_PEER&&now-t>30000){if(now-t>120000&&!chg['x'+k]){chg['x'+k]=1;fbReq(path+'/'+k,'DELETE').catch(()=>{});}continue;}
   const pres=v.p&&typeof v.p==='object'?v.p:{},key=JSON.stringify(pres);if(chg[k]!==key){chg[k]=key;chg['u'+k]=now;}
   list.push({peer:k,by:null,isMe:k===FB_PEER,sameTab:k===FB_PEER,kind:'viewer',guest:false,presence:pres,updatedAt:chg['u'+k]||now});}
  snap=list;fire();}
 function setAt(p,val){const ks=String(p).split('/').filter(Boolean);
  if(!ks.length){tree=val&&typeof val==='object'?val:{};return;}
  let o=tree;for(let i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]];}
  const lk=ks[ks.length-1];if(val===null)delete o[lk];else o[lk]=val;}
 try{es=new EventSource(FB+'/'+path+'.json');
  es.addEventListener('put',e=>{try{const d=JSON.parse(e.data);setAt(d.path,d.data);rebuild();}catch(x){}});
  es.addEventListener('patch',e=>{try{const d=JSON.parse(e.data);for(const k in d.data)setAt(String(d.path).replace(/\/$/,'')+'/'+k,d.data[k]);rebuild();}catch(x){}});
  es.onopen=()=>ces.forEach(h=>h(true));}catch(e){}
 hb=setInterval(()=>{if(!closed){send();rebuild();}},10000);
 fbOpen.add(room);send();return room;
}
function fbDB(){return{collection(c){return{
 doc(id){return{set(o){return fbReq(fbKey(c)+'/'+fbKey(id),'PUT',o);}};},
 orderBy(f){const q={f,n:50};const api={limit(n){q.n=n;return api;},get(){return fbReq(fbKey(c),'GET').then(v=>{
  const arr=Object.keys(v||{}).filter(k=>v[k]&&typeof v[k]==='object').map(k=>({id:k,data:()=>v[k]}));
  arr.sort((a,b)=>(Number(b.data()[q.f])||0)-(Number(a.data()[q.f])||0));const docs=arr.slice(0,q.n);return{docs,size:docs.length,empty:!docs.length};});}};return api;}};}};}

let ROOM=null,lobbyPeersList=[],onlineTab='rank',VS=null,seenInv={},invPending=null,lobbyRR=0,friendSeen={};
const MATCH_T=90;
const peerOK=p=>p&&p.kind==='viewer'&&!p.sameTab&&p.presence&&typeof p.presence.fc==='string';
const pNick=p=>esc(String(p.presence.nick||'냥이').slice(0,10));
const safeB=v=>BREED[v]?v:'cheese',safeO=v=>OUTFIT[v]?v:'none';
function myInfo(){return{fc:save.fcode,nick:(save.nick||'냥이').slice(0,10),best:save.best,breed:save.breed,outfit:save.outfit};}
function lobbyInit(){
 lobbyUpdate();
 ROOM.onPeers(ch=>{lobbyPeersList=ch.peers.filter(peerOK);
  for(const p of lobbyPeersList){const fc=p.presence.fc;const fr=save.friends.find(f=>f.code===fc);if(fr){fr.nick=String(p.presence.nick||fr.nick).slice(0,10);fr.best=Math.max(0,Math.floor(Number(p.presence.best)||0));friendSeen[fc]=Date.now();}
   const inv=p.presence.inv;
   if(inv&&inv.to===save.fcode&&typeof inv.room==='string'&&!seenInv[inv.room]&&Date.now()-p.updatedAt<60000&&!VS){seenInv[inv.room]=1;showInvite(p,inv.room);}}
  if(ROOM&&!VS)tryPair();
  softRerender();},()=>{});
}
let lobbyLast='';
function lobbyUpdate(extra){if(!ROOM)return;const o=Object.assign(myInfo(),extra||{});const k=JSON.stringify(o);if(k===lobbyLast&&!extra)return;lobbyLast=k;ROOM.presence(o).catch(()=>{});}
function softRerender(){const now=Date.now();if(now-lobbyRR<500)return;lobbyRR=now;if(curPanel==='online'&&$('modal').classList.contains('on')){const inp=$('fcIn'),rc=$('rcIn'),a=inp&&inp.value,b=rc&&rc.value;rerender();if($('fcIn')&&a)$('fcIn').value=a;if($('rcIn')&&b)$('rcIn').value=b;}}
function showInvite(p,room){invPending={room,nick:String(p.presence.nick||'친구').slice(0,10)};
 if(state!=='home'){toast('⚔️ '+invPending.nick+'님이 대결을 신청했어요 (홈에서 확인)');return;}
 onlineTab='vs';openPanel('online');sfx('zone');}
/* 랜덤 매칭: 대기열에 있는 사람끼리 순서대로 짝을 지어요 */
function tryPair(){
 const me=ROOM.peers().find(p=>p.sameTab);if(!me||!me.presence||!me.presence.q)return;
 const q=ROOM.peers().filter(p=>p.kind==='viewer'&&p.presence&&p.presence.q&&p.presence.fc).sort((a,b)=>(a.presence.q-b.presence.q)||(a.peer<b.peer?-1:1));
 const i=q.findIndex(p=>p.sameTab);if(i<0)return;const j=i%2===0?i+1:i-1;if(j>=q.length)return;
 const name=('rm-'+[me.peer,q[j].peer].sort().join('-')).toLowerCase().replace(/[^a-z0-9_.-]/g,'').slice(0,48);
 lobbyUpdate({q:null});joinMatch(name,'random','');
}
async function joinMatch(name,kind,code){
 if(!ROOM){toast('온라인에 연결되지 않았어요');return;}
 if(VS)await vsLeave();
 try{const room=await ROOM.join(name);
  VS={room,name,kind,code,phase:'lobby',rdy:false,opp:null,oppPeer:null,host:false,seed:0,n:0,lastGo:0,t:MATCH_T,myDead:false,oppDead:false,oppMax:0,gx:0,gy:0,sendT:0,result:null,oppLeft:false};
  room.presence(Object.assign(myInfo(),{rdy:false})).catch(()=>{});
  room.onPeers(()=>vsPeers(),()=>{});
  onlineTab='vs';if(state==='home')openPanel('online');
 }catch(e){toast('방에 들어가지 못했어요. 잠시 후 다시 해 주세요');}
}
async function vsLeave(){if(!VS)return;const r=VS.room;VS=null;try{await r.leave();}catch(e){}lobbyUpdate({q:null,inv:null});}
function vsPeers(){
 if(!VS)return;const ps=VS.room.peers(),me=ps.find(p=>p.sameTab);
 const others=ps.filter(peerOK).sort((a,b)=>a.peer<b.peer?-1:1),o=others[0]||null;
 if(VS.oppPeer&&(!o||o.peer!==VS.oppPeer)){ if(VS.phase==='play'){VS.oppLeft=true;VS.oppDead=true;} }
 VS.opp=o;VS.oppPeer=o?o.peer:null;VS.host=!!(me&&o&&me.peer<o.peer);
 if(o){const g=o.presence.g;if(g&&typeof g==='object'){VS.gx=Number(g.x)||MX;VS.gy=Number(g.y)||0;VS.gm=g.m|0;VS.gs=g.s==='L'?'L':'R';VS.gf=g.fa<0?-1:1;
   if(VS.phase==='play'){VS.oppMax=Math.max(VS.oppMax,Math.floor(Number(g.f)||0));if(g.al===false)VS.oppDead=true;}}
  const go=o.presence.go;if(go&&!VS.host&&go.n>VS.lastGo&&(VS.phase==='lobby'||VS.phase==='result')&&VS.rdy){VS.lastGo=go.n;vsBegin(go.seed>>>0);}}
 if(VS.host&&o&&VS.rdy&&o.presence.rdy&&(VS.phase==='lobby'||VS.phase==='result')){VS.n=Math.max(VS.n,VS.lastGo)+1;VS.lastGo=VS.n;const seed=(Math.random()*1e9)>>>0,room=VS.room,n=VS.n;vsBegin(seed);room.presence({go:{n,seed}}).catch(()=>{});}
 if(VS.phase==='result'&&VS.oppPeer==null&&$('over').classList.contains('on'))$('otitle').textContent='상대가 방을 나갔어요';
 softRerender();
}

 v.room.presence({rdy:false,g:{x:MX,y:GROUND_Y,f:1,m:0,s:'R',fa:1,al:true}}).catch(()=>{});
 curPanel=null;resetRun('versus',seed);generate();state='vscount';enterHud();$('modeTag').textContent='⚔️ 대결 준비';
 const z=$('zone');z.style.display='block';z.textContent='3';zoneT=0;sfx('elev');

 const m=c.mode==='ground'?0:c.mode==='wall'?(c.snow?5:1):c.mode==='air'?(c.spinT>0?3:2):c.mode==='dead'?4:2;
 v.room.presence({g:{x:Math.round(c.x),y:Math.round(c.y),f:runFloor,m,s:c.side||'R',fa:c.face,al:!v.myDead}}).catch(()=>{});}
function vsTick(dt){
 const v=VS;if(!v)return;
 if(state==='vscount'){v.cd-=dt;const n=Math.ceil(v.cd);const z=$('zone');z.textContent=n>0?String(n):'시작!';
  if(v.cd<=0){state='play';v.phase='play';z.style.display='none';$('hint').style.display='block';sfx('zone');}return;}

 v.t-=dt;vsSend(false);
 if(v.dgx===undefined){v.dgx=v.gx;v.dgy=v.gy;}
 v.dgx+=(v.gx-v.dgx)*Math.min(1,dt*14);v.dgy+=(v.gy-v.dgy)*Math.min(1,dt*14);
 if(state==='spect'){updHazards(dt);runT+=dt;const tgt=v.dgy-H*.58;camY+=(tgt-camY)*Math.min(1,dt*4);generate();}
 const tl=Math.max(0,Math.ceil(v.t)),mm=Math.floor(tl/60),ss=String(tl%60).padStart(2,'0');
 $('modeTag').textContent='⚔️ '+(v.opp?String(v.opp.presence.nick||'상대').slice(0,8):'상대')+' '+fmt(v.oppMax)+'층 · ⏱ '+mm+':'+ss;
 if(v.t<=0||(v.myDead&&v.oppDead)||v.oppLeft)vsEnd();
}

 $('otitle').textContent=v.oppLeft?'🏆 상대가 나가서 승리!':win?'🏆 승리!':draw?'🤝 무승부':'😿 아쉽게 졌어요';

 $('okw').style.display=runCandy>0?'inline-flex':'none';$('onew').style.display=newBest?'block':'none';$('revBtn').style.display='none';

const CODECH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

 if(save.friends.some(f=>f.code===code)){toast('이미 친구예요');return;}
 const p=lobbyPeersList.find(x=>x.presence.fc===code);
 save.friends.push({code,nick:p?String(p.presence.nick||'친구').slice(0,10):'친구',best:p?Math.floor(Number(p.presence.best)||0):0});persist();sfx('buy');toast('친구를 추가했어요!');rerender();}

function applySave(s){const fresh=JSON.parse(JSON.stringify(DEF));for(const k in fresh)save[k]=fresh[k];
 for(const k in s){if(DEF[k]&&typeof DEF[k]==='object'&&!Array.isArray(DEF[k]))Object.assign(save[k],s[k]);else if(s[k]!==undefined)save[k]=s[k];}
 if(!BREED[save.breed])save.breed='cheese';if(!OUTFIT[save.outfit])save.outfit='none';if(!save.fcode)save.fcode=mkCode(6);}
async function hashPw(pw,salt){const d=new TextEncoder().encode(salt+'|nyang|'+pw);const h=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
const normId=s=>String(s||'').trim().toLowerCase();
onPersist=()=>{if(!FB||!session)return;clearTimeout(cloudT);cloudT=setTimeout(()=>{fbReq('users/'+session.id+'/save','PUT',save).catch(()=>{});},1500);};

 accBusy=true;try{const ex=await fbReq('users/'+id,'GET');if(ex){toast('이미 있는 아이디예요');return;}
  const salt=mkCode(12),h=await hashPw(pw,salt);save.nick=nick;save._t=Date.now();

function press(){audio();
 if(state==='ready'){state='play';$('hint').style.display='none';jump();}
 else if(state==='play'){if(cat&&cat.mode==='ground')$('hint').style.display='none';jump();}}
stage.addEventListener('pointerdown',e=>{if(e.target!==canvas)return;e.preventDefault();press();});
stage.addEventListener('click',e=>{const t=e.target.closest('[data-open],[data-act]');if(!t||t.disabled)return;audio();
 if(t.dataset.open){sfx('click');openPanel(t.dataset.open);}else if(ACT[t.dataset.act])ACT[t.dataset.act](t.dataset.arg,t);if(t.blur)t.blur();});
window.addEventListener('keydown',e=>{
 if(e.target&&e.target.tagName==='INPUT')return;
 const k=e.code;
 if(k==='Space'||k==='ArrowUp'||k==='KeyW'){e.preventDefault();
  if(state==='ready'||state==='play')press();
  else if(state==='over'&&overT>.6&&!e.repeat)ACT.retry();
  else if(state==='paused'&&!e.repeat)togglePause();}
 else if(k==='Escape'||k==='KeyP'){if(['play','ready','paused'].includes(state))togglePause();else if($('modal').classList.contains('on'))closeModal();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='ready'))togglePause();});

function resize(){
 const r=$('app').getBoundingClientRect(),vw=Math.max(1,r.width),vh=Math.max(1,r.height);let sw,sh;
 if(vw/vh<W/320){sw=vw;H=Math.round(clamp(W*vh/vw,320,400));sh=sw*H/W;if(sh>vh){sh=vh;sw=sh*W/H;}}
 else{H=320;sh=vh;sw=sh*W/H;}
 S=clamp(Math.round(sw*Math.min(2,window.devicePixelRatio||1)/W),2,4);canvas.width=W*S;canvas.height=H*S;ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
 stage.style.width=Math.floor(sw)+'px';stage.style.height=Math.floor(sh)+'px';
 document.documentElement.style.setProperty('--u',(sw/W)+'px');
 if(state==='home')camY=-(H-70);
}

function tick(dt){
 gt+=dt;shake=Math.max(0,shake-dt);
 if(state==='play')updatePlay(dt);
 else if(state==='dying')updateDying(dt);
 else if(state==='elevator')updateElev(dt);
 else if(state==='over')overT+=dt;
 else if(state==='spect'||state==='vscount')vsTick(dt);
 else if(state==='count')tickCount(dt);
